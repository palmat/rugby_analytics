name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # profiles.yml is git-ignored, so this dummy profile only exists on the runner.
      # `dbt parse` never connects to BigQuery.
      - name: Write dummy dbt profile
        run: |
          cat > profiles.yml <<'PROFILE'
          rugby_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: ci-dummy-project
                dataset: ci_dummy
                location: europe-west2
                threads: 1
          PROFILE
      - run: dbt deps
      - run: dbt parse

  sqlfluff:
    name: SQLFluff (changed models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # Jinja templater (see .sqlfluff): no dbt, profile or BigQuery connection needed.
      - run: pip install sqlfluff==4.5.0
      - name: Lint changed SQL files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'models/*.sql' 'models/**/*.sql')
          if [ -z "$files" ]; then
            echo "No model SQL files changed; nothing to lint."
            exit 0
          fi
          echo "Linting:"; echo "$files"
          sqlfluff lint $files

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install ruff==0.17.3
      - run: ruff check scripts/

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
