version: 2

models:
  - name: int_team_match_stats
    description: "One row per team per match, with home/away resolved and stats joined. Duplicate fixtures ingested under different match_ids are removed."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id]
    columns:
      - name: match_id
        tests:
          - not_null
      - name: team_id
        description: "Canonical team slug from ref_team"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_team')
                field: team_id
      - name: date_key
        tests:
          - not_null
      - name: is_home
        tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: is_away
        tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']

  - name: int_team_match_scores
    description: "Reported, derived and corrected scores per team per match"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id]
    columns:
      - name: match_id
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: is_score_swapped
        tests:
          - not_null

  - name: int_team_match_points
    description: "League points per team per match: match, losing bonus and try bonus"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id]
    columns:
      - name: match_id
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: match_points
        tests:
          - accepted_values:
              arguments:
                values: [0, 2, 4]
                quote: false
      - name: try_bonus_point
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: losing_bonus_point
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
