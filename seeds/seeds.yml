version: 1

seeds:
  - name: ref_position
    description: "Reference data for rugby positions"
    columns:
      - name: position_id
        description: "Unique identifier for the position"
        tests:
          - unique
          - not_null
      - name: position
        description: "Name of the rugby position"
        tests:
          - not_null
      - name: position_description
        description: "Description of the rugby position"
        tests:
          - not_null
      - name: position_group
        description: "{{ doc('position_group') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Front Row', 'Second Row', 'Back Row', 'Half-Backs', 'Centres', 'Back Three', 'Forwards Substitute', 'Backs Substitute', 'Unknown']
      - name: position_unit
        description: "{{ doc('position_unit') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Forwards', 'Backs', 'Unknown']
      - name: shirt_number
        description: "Shirt number associated with the position"
  - name: ref_stadium
    description: "Reference data for rugby stadiums"
    columns:
      - name: stadium_id
        description: "Unique identifier for the stadium"
        tests:
          - unique
          - not_null
      - name: club_name
        description: "Name of the club associated with the stadium"
        tests:
          - not_null
      - name: stadium_name
        description: "Name of the rugby stadium"
        tests:
          - not_null
      - name: nickname
        description: "Nickname for the stadium"
      - name: venue_type
        description: "Type of venue (e.g., Primary Home, Secondary Home)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Primary Home', 'Marquee Venue']
      - name: city
        description: Stadiums Town/City location
      - name: county
        description: Stadiums County location
      - name: postcode
        description: Stadiums Postcode
      - name: address
        description: Stadiums Full Address
      - name: latitude
        description: "Latitude coordinate of the stadium"
      - name: longitude
        description: "Longitude coordinate of the stadium"
      - name: capacity
        description: "Seating capacity of the stadium"
      - name: pitch_surface
        description: "Type of pitch surface (e.g., Grass, Artificial)"
      - name: year_opened
        description: "Year the stadium was opened"
  - name: ref_team
    description: "Reference data for rugby teams"
    columns:
      - name: team_id
        description: "Unique identifier for the team"
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Name of the rugby team"
        tests:
          - not_null
      - name: nickname
        description: "Common nickname used for the team"
      - name: short_code
        description: "Short code abbreviation for the team"
      - name: year_formed
        description: "Year the team was founded"
      - name: squad_size
        description: "Number of players in the team's squad"
      - name: club_captain
        description: "Name of the club captain"
      - name: mascot_name
        description: "Name of the team's mascot"
      - name: mascot_description
        description: "Description of the team's mascot"
      - name: home_shirt_details
        description: "Description of the home kit shirt"
      - name: away_shirt_details
        description: "Description of the away kit shirt"
      - name: third_strip_details
        description: "Description of the third kit strip"
      - name: kit_manufacturer
        description: "Manufacturer of the team's kit"
      - name: main_shirt_sponsor
        description: "Main sponsor featured on the team's shirt"
      - name: premiership_titles
        description: "Number of premiership titles won by the team"
      - name: last_premiership_title
        description: "Year of the team's most recent premiership title"
      - name: european_champions_cup_titles
        description: "Number of European Champions Cup titles won by the team"
      - name: social_media_handle
        description: "Team's official social media handle"
      - name: official_website
        description: "URL of the team's official website"
      - name: chairperson
        description: "Name of the team's chairperson"
      - name: director_of_rugby
        description: "Name of the team's director of rugby"
      - name: head_coach
        description: "Name of the team's head coach"
  - name: ref_team_name_mapping
    description: "Maps every team name variant found in the rugbyapi source data (short names, full names, rebrand names) to the canonical team_id used in ref_team"
    columns:
      - name: source_team_name
        description: "Team name as it appears in a rugbyapi source table"
        tests:
          - unique
          - not_null
      - name: team_id
        description: "Canonical team_id from ref_team that this source name resolves to"
        tests:
          - not_null
  - name: ref_venue_team_mapping
    description: "Maps a rugbyapi venue_id to the ref_team.team_id of the club whose home ground it is, derived from which team appears in every match played at that venue. Genuinely neutral/one-off venues (e.g. cup finals at a shared stadium) are intentionally omitted."
    columns:
      - name: venue_id
        description: "Venue id as it appears in the rugbyapi match_details source"
        tests:
          - unique
          - not_null
      - name: team_id
        description: "Canonical team_id from ref_team for the club that home-hosts at this venue"
        tests:
          - not_null
  - name: ref_match_home_team_override
    description: "Manually confirmed home-team corrections for one-off marquee/neutral-venue matches where the source's home_team label is wrong and no venue-frequency rule can resolve it (each venue only hosted that fixture once)"
    columns:
      - name: match_id
        description: "match_id of the fixture being corrected"
        tests:
          - unique
          - not_null
      - name: team_id
        description: "Canonical team_id from ref_team for the confirmed true home team"
        tests:
          - not_null